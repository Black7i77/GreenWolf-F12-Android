<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#dedfe3;font:13px system-ui,sans-serif}header{display:flex;align-items:center;gap:6px;background:#222428;padding:8px;overflow:auto;white-space:nowrap}button{border:0;background:#30343a;color:#ddd;border-radius:5px;padding:9px;cursor:pointer}button.selected{border-bottom:3px solid #12aafa;color:#fff}#tabs{display:flex;overflow:auto;background:#1d2024}#tabs button{background:transparent;border-radius:0}#filters{display:flex;gap:5px;overflow:auto;padding:7px;background:#1b1d20}#filters button{border-radius:20px;font-size:12px}input{background:#111316;border:1px solid #41454a;border-radius:6px;color:#fff;padding:10px;min-width:0}#filter{width:100%}#main{height:calc(100vh - 165px);overflow:auto}#cmdbar{position:absolute;bottom:0;left:0;right:0;display:flex;background:#202226;padding:5px;gap:5px}#command{flex:1}#main .row{border-bottom:1px solid #292b30;padding:8px 10px;overflow-wrap:anywhere}.code{font:12px monospace;white-space:pre-wrap;overflow-wrap:anywhere;padding:8px;line-height:1.55}.tag{color:#09c6ff}.attr{color:#ff9e35}.val{color:#e9dc8e}.comment{color:#92979e}.badge{display:inline-block;border-radius:4px;padding:3px 6px;background:#14a878;color:#fff;font-weight:700}.post{background:#347eec}.options{background:#9858de}.status{color:#18b983;font-weight:700;margin:0 8px}.muted{color:#9da2aa}.err{color:#f86d6d}.url{font:12px monospace;overflow-wrap:anywhere}#edit{display:none;background:#24272a;padding:8px}#edit input{width:100%;margin:4px 0}#edit button{margin:4px}.hidden{display:none!important}</style></head><body>
<header><strong style="color:#77e5a4">🐺 F12</strong><button onclick="dock('left')">◧</button><button onclick="dock('bottom')">▤</button><button onclick="dock('right')">◨</button><button onclick="dock('top')">▥</button><button onclick="Wolf.refreshSource()">↻</button><span id="page" class="muted"></span></header>
<div id="tabs"><button onclick="tab('Elements')">Elements</button><button onclick="tab('Console')">Console</button><button onclick="tab('Network')">Network</button><button onclick="tab('Source')">Source</button></div>
<div id="filters"><input id="filter" placeholder="Filter URL, method, HTML..." oninput="render()"><label style="white-space:nowrap"><input type="checkbox" onchange="Wolf.setPreserve(this.checked)"> Preserve</label><button onclick="network=[];render()">Clear</button></div>
<div id="edit"><div class="muted">Edit DOM (CSS selector and property)</div><input id="selector" placeholder="CSS selector e.g. h1"><input id="property" placeholder="Attribute or textContent" value="textContent"><input id="value" placeholder="New value"><button onclick="Wolf.editNode(selector.value,property.value,value.value)">Apply change</button></div>
<div id="main"></div><div id="cmdbar"><input id="command" placeholder="› JavaScript command"><button onclick="run()">Run ↵</button></div>
<script>
let current='Elements',source='',network=[],logs=[],page='',filter='';const main=document.getElementById('main');
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tab(t){current=t;Wolf.switchTab(t);render()}
function dock(side){Wolf.setDock(side)}
function run(){let c=document.getElementById('command'),s=c.value.trim();if(!s)return;logs.push({message:'› '+s,level:'COMMAND'});c.value='';tab('Console');Wolf.command(s);render()}
document.getElementById('command').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
function highlight(s){return escapeHTML(s).replace(/(&lt;\/?[\w:-]+)/g,'<span class="tag">$1</span>').replace(/([\w:-]+)=(&quot;.*?&quot;)/g,'<span class="attr">$1</span>=<span class="val">$2</span>')}
function category(url){let p=url.split('?')[0];if(/\.(png|jpg|jpeg|webp|svg|gif)$/i.test(p))return 'Img';if(/\.css$/i.test(p))return 'CSS';if(/\.js$/i.test(p))return 'JS';return 'Fetch/XHR'}
function render(){filter=document.getElementById('filter').value.toLowerCase();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('selected',b.textContent===current));document.getElementById('edit').style.display=current==='Elements'?'block':'none';
let html='';if(current==='Network'){html=network.filter(x=>(x.method+' '+x.url+' '+x.status).toLowerCase().includes(filter)).slice(-350).map(x=>'<div class="row"><span class="badge '+(x.method==='POST'?'post':x.method==='OPTIONS'?'options':'')+'">'+escapeHTML(x.method)+'</span><span class="status">'+escapeHTML(x.status==='—'?'?':x.status)+'</span><span class="url">'+escapeHTML(x.url)+'</span> <span class="muted">'+category(x.url)+'</span></div>').join('');}
else if(current==='Console'){html=logs.filter(x=>(x.message||'').toLowerCase().includes(filter)).slice(-250).map(x=>'<div class="row '+(/ERROR|SEVERE/.test(x.level)?'err':'')+'"><span class="muted">'+escapeHTML(x.level)+' </span>'+escapeHTML(x.message)+'</div>').join('')}
else{let lines=source.split('\n');if(!source.includes('\n'))lines=source.replace(/></g,'>\n<').split('\n');html='<div class="code">'+lines.filter(x=>x.toLowerCase().includes(filter)).slice(0,1800).map(highlight).join('\n')+'</div>'}main.innerHTML=html||'<div class="row muted">No data yet. Reload the page to capture activity.</div>'}
window.fromAndroid=function(type,data){if(type==='network'){try{network.push(JSON.parse(data));if(network.length>1000)network.shift()}catch(e){}}
else if(type==='httpError'||type==='resourceError'){try{let x=JSON.parse(data);let item=[...network].reverse().find(n=>n.url===x.url);if(item)item.status=String(x.status)}catch(e){}}
else if(type==='console'){try{logs.push(JSON.parse(data))}catch(e){}}
else if(type==='result'){logs.push({level:'RESULT',message:data})}
else if(type==='source'){source=data}
else if(type==='page'){page=data;document.getElementById('page').textContent=page.replace(/^https?:\/\//,'').slice(0,22)}
else if(type==='clearNetwork'){network=[]}
if(logs.length>500)logs.shift();render()};render();
</script></body></html>
